name: Sync upstream

on:
  schedule:
    - cron: "51 20 * * *"   # TEMP schedule test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/zhaoshihang/dsh-purge.git || true
          git fetch --no-tags upstream master
          UP=$(git rev-parse upstream/master)
          echo "upstream=$UP head=$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
            exit 0
          fi
          if git merge --no-edit upstream/master; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/$UP"
          else
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Sync conflict::Upstream conflicts with local commits. Manual merge required."
            exit 1
          fi

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master

      - name: Summary
        run: |
          {
            echo "### Upstream sync"
            echo "- upstream: \`$(git rev-parse upstream/master)\`"
            echo "- fork head: \`$(git rev-parse HEAD)\`"
            echo "- changed: \`${{ steps.merge.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
